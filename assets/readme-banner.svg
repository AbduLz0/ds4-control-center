<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">DS4 Control Center — One controller. Every game.</title>
  <desc id="banner-desc">A native Linux dashboard for the Sony DualShock 4 with live diagnostics, a universal game library, a virtual Xbox 360 pad and keyboard mapping.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset=".55" stop-color="#080d16"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70c7ff"/>
      <stop offset=".48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4ce3b6"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5bb8ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5bb8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-mint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4ce3b6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4ce3b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a3d"/>
      <stop offset="1" stop-color="#0b111a"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#9db2d3" stroke-opacity=".075"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="300" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1080" cy="-40" r="340" fill="url(#glow-blue)"/>
    <circle cx="910" cy="330" r="300" fill="url(#glow-violet)"/>
    <circle cx="80" cy="320" r="270" fill="url(#glow-mint)"/>
  </g>
  <rect x=".8" y=".8" width="1198.4" height="298.4" rx="25.2" fill="none" stroke="#a9bdd9" stroke-opacity=".2" stroke-width="1.6"/>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(64 58)">
      <circle cx="4" cy="5" r="4" fill="#4ce3b6"/>
      <text x="18" y="10" fill="#8fa0b8" font-size="12.5" font-weight="600" letter-spacing="3.2">NATIVE LINUX · DUALSHOCK 4</text>
    </g>

    <text x="64" y="148" fill="#f1f6ff" font-size="57" font-weight="700" letter-spacing="-2.4">DS4 CONTROL CENTER</text>
    <text x="64" y="192" fill="url(#accent)" font-size="27" font-weight="600" letter-spacing="-.3">One controller. Every game.</text>
    <text x="64" y="232" fill="#93a3bb" font-size="14.5">Live diagnostics · Universal game library · Virtual Xbox pad · Keyboard mapping</text>

    <g transform="translate(64 268)">
      <rect width="118" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
      <text x="132" y="6" fill="#6b7c95" font-size="10.5" letter-spacing="2.4">BUILT FOR THE DESKTOP</text>
    </g>
  </g>

  <g transform="translate(900 46)">
    <rect width="236" height="208" rx="24" fill="#0a101b" fill-opacity=".86" stroke="#a9bdd9" stroke-opacity=".22" stroke-width="1.4"/>
    <circle cx="118" cy="94" r="92" fill="url(#glow-blue)" opacity=".75"/>
    <g transform="translate(32 6) scale(1.345)">
      <path d="M36 48h56a20 20 0 0 1 19.5 15.5l4.5 21a12 12 0 0 1-20.5 10.5L82 82H46l-13.5 13a12 12 0 0 1-20.5-10.5l4.5-21A20 20 0 0 1 36 48z" fill="url(#pad-shell)" fill-opacity=".55" stroke="#3ea6ff" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M44 58v16M36 66h16" stroke="#3ea6ff" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="84" cy="62" r="3.3" fill="#a78bfa"/>
      <circle cx="94" cy="72" r="3.3" fill="#4ce3b6"/>
      <path d="M52 44h24" stroke="#7cc4ff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    </g>
    <circle cx="118" cy="194" r="3.2" fill="#4ce3b6"/>
    <text x="130" y="198" fill="#9fb2c9" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="10.5" letter-spacing="1.7">READY TO CONNECT</text>
    <g transform="translate(151 14)">
      <rect width="70" height="22" rx="11" fill="#4ce3b6" fill-opacity=".08" stroke="#4ce3b6" stroke-opacity=".28"/>
      <text x="35" y="15" text-anchor="middle" fill="#8ff0d5" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing=".5">v1.4.0</text>
    </g>
  </g>
</svg>
